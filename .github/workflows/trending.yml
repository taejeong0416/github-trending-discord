name: GitHub Trending Brief

on:
  schedule:
    # 23:00 UTC = 08:00 KST (매일)
    - cron: "0 23 * * *"
  workflow_dispatch: # 수동 실행 버튼
    inputs:
      dry_run:
        description: "디스코드에 보내지 않고 로그로만 확인"
        type: boolean
        default: false

jobs:
  brief:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests beautifulsoup4
      - run: python brief.py ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
